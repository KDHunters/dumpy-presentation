/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,

                &lt;/div&gt;&lt;div class=&quot;mw-adhd-label&quot;&gt;ADHD&lt;/div&gt;&lt;div class=&quot;eyebrow&quot;&gt;MIND-WANDERING&lt;/div&gt;&lt;h1 class=&quot;mw-title&quot;&gt;“마인드 원더링”&lt;/h1&gt;&lt;div class=&quot;mw-comparison&quot;&gt;&lt;div class=&quot;mw-chart&quot; role=&quot;img&quot; aria-label=&quot;지속주의 과제 5초 지연 조건의 마인드 원더링 보고 비율: 비ADHD 대조군 13%, ADHD 집단 69%. 공통 0에서 100퍼센트 축.&quot;&gt;&lt;div class=&quot;vertical-plot&quot;&gt;&lt;div class=&quot;y-axis&quot;&gt;&lt;span&gt;100%&lt;/span&gt;&lt;span&gt;75&lt;/span&gt;&lt;span&gt;50&lt;/span&gt;&lt;span&gt;25&lt;/span&gt;&lt;span&gt;0&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;columns&quot;&gt;&lt;div class=&quot;column&quot;&gt;&lt;div class=&quot;vbar control&quot; style=&quot;height:13%&quot;&gt;&lt;b&gt;13%&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;column-label&quot;&gt;비ADHD 대조군&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;column&quot;&gt;&lt;div class=&quot;vbar adhd&quot; style=&quot;height:69%&quot;&gt;&lt;b&gt;69%&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;column-label&quot;&gt;ADHD 집단&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ratio&quot;&gt;&lt;strong&gt;&lt;small&gt;약&lt;/small&gt; 5.3&lt;span&gt;배&lt;/span&gt;&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;footer class=&quot;slide-footer&quot;&gt;&lt;span&gt;Dumpy · 생각에서 할 일까지&lt;/span&gt;&lt;span&gt;02 / 17&lt;/span&gt;&lt;/footer&gt;&lt;/section&gt;&lt;section class=&quot;slide &quot; aria-label=&quot;3. 기억하는 데도 주의력이 든다&quot;&gt;&lt;div class=&quot;slide-body&quot;&gt;&lt;div class=&quot;memory-scene&quot;&gt;&lt;h1&gt;기억하는 데도&lt;br&gt;&lt;em&gt;주의력이 든다&lt;/em&gt;&lt;/h1&gt;&lt;div class=&quot;mental-space&quot;&gt;&lt;svg class=&quot;person-silhouette&quot; viewBox=&quot;0 0 400 400&quot; aria-label=&quot;사람의 머리 옆모습 실루엣&quot; role=&quot;img&quot;&gt;&lt;path d=&quot;M105 355 L102 283 C83 254 73 219 76 181 C80 101 132 53 209 53 C281 53 322 101 323 166 L350 217 Q357 227 342 232 L325 234 L322 2 m:7&quot;&gt;&lt;span class=&quot;empty-check&quot;&gt;&lt;/span&gt;택배 반품 챙기기&lt;/li&gt;&lt;li style=&quot;--item:8&quot;&gt;&lt;span class=&quot;empty-check&quot;&gt;&lt;/span&gt;편의점에 반품 맡기기&lt;/li&gt;&lt;li style=&quot;--item:9&quot;&gt;&lt;span class=&quot;empty-check&quot;&gt;&lt;/span&gt;나갈 때 쓰레기 버리기&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;span class=&quot;stuck-prelude&quot;&gt;적긴 했는데…&lt;/span&gt;&lt;h1&gt;뭐부터 &lt;em&gt;하지?&lt;/em&gt;&lt;/h1&gt;&lt;/div&gt;&lt;/div&gt;&lt;footer class=&quot;slide-footer&quot;&gt;&lt;span&gt;Dumpy · 생각에서 할 일까지&lt;/span&gt;&lt;span&gt;06 / 17&lt;/span&gt;&lt;/footer&gt;&lt;/section&gt;&lt;section class=&quot;slide &quot; aria-label=&quot;7. 꺼내는 건 쉽지만, 순서에서 막힌다&quot;&gt;&lt;div class=&quot;slide-body&quot;&gt;&lt;div class=&quot;quotation-scene&quot;&gt;&lt;div class=&quot;quote-first&quot;&gt;&lt;div class=&quot;big-quote&quot;&gt;“&lt;/div&gt;&lt;blockquote&gt;&lt;p&gt;“브레인 덤프로 꺼내는 건 쉽지만…&lt;br&gt;&lt;em&gt;순서를 정하는 데서 막힌다.”&lt;/em&gt;&lt;/p&gt;&lt;div class=&quot;quote-english&quot; lang=&quot;en&quot;&gt;“… easy to do a brain dump … stuck figuring out an order …”&lt;/div&gt;&lt;/blockquote&gt;&lt;/div&gt;&lt;div class=&quot;quote-second&quot;&gt;&lt;blockquote&gt;&lt;p&gt;“때로는 목록이 너무 길어서&lt;br&gt;&lt;em&gt;어디서부터 시작해야 할지 모른다.”&lt;/em&gt;&lt;/p&gt;&lt;div class=&quot;quote-english&quot; lang=&quot;en&quot;&gt;“Sometimes the list is too long and they don’t know where to start.”&lt;/div&gt;&lt;/blockquote&gt;&lt;/div&gt;&lt;div class=&quot;quote-credit&quot;&gt;&lt;strong&gt;– Sharon Saline, PsyD&lt;/strong&gt;&lt;span&gt;임상심리학자 · Psych Central ADHD 정리 가이드 인터뷰&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;footer class=&quot;slide-footer&quot;&gt;&lt;span&gt;Dumpy · 생각에서 할 일까지&lt;/span&gt;&lt;span&gt;07 / 17&lt;/span&gt;&lt;/footer&gt;&lt;/section&gt;&lt;section class=&quot;slide &quot; aria-label=&quot;8. 인터뷰에서도 비슷한 어려움&quot;&gt;&lt;div class=&quot;slide-body&quot;&gt;&lt;div class=&quot;story-center&quot;&gt;&lt;span class=&q
